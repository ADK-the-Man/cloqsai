services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cloudcost_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudcost_db
      POSTGRES_USER: cloudcost
      POSTGRES_PASSWORD: cloudcost_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcost -d cloudcost_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AWS Pricing Calculator MCP Sidecar ────────────────────────────────────
  aws-mcp-sidecar:
    image: node:22-alpine
    container_name: cloudcost_aws_mcp
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      PORT: "8000"
      HOST: "0.0.0.0"
      TRACE: "off"
    command: >
      sh -c "npm install -g sample-aws-pricing-calculator-mcp@latest &&
             node /patch_mcp.js &&
             npx sample-aws-pricing-calculator-mcp"
    volumes:
      - ./patch_mcp.js:/patch_mcp.js:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudcost_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudcost:cloudcost_dev@postgres:5432/cloudcost_db
      AWS_MCP_URL: http://aws-mcp-sidecar:8000
      ARTIFACTS_DIR: /app/artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://98.88.34.62:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOGIN_ENABLED: "true"
    volumes:
      - artifacts_data:/app/artifacts
      - ./backend:/app  # hot reload in dev
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health 2>/dev/null || curl -f http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8001 --reload"

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudcost_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      BACKEND_INTERNAL_URL: http://backend:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 2>/dev/null || curl -f http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  artifacts_data:
    driver: local
